<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #f3f0ea;
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: #c96f4a; } a:hover { color: #a4512f; }
    .hero { position: relative; overflow: hidden; border-radius: 20px; padding: 24px;
      min-height: 210px; color: #fff; box-shadow: 0 2px 10px rgba(60, 50, 40, .09);
      background: linear-gradient(160deg, #3f7fc4, #79b0e0 70%, #a8cdec); }
    .datos { position: relative; z-index: 1; }
    .grados { font-size: 72px; line-height: .95; font-weight: 200; letter-spacing: -.045em; }
    .grados sup { font-size: .35em; font-weight: 400; vertical-align: super; margin-left: .05em; }
    .condicion { font-size: 18.4px; font-weight: 600; margin-top: 3.2px; }
    .linea { font-size: 13.6px; opacity: .85; margin-top: 8px;
      display: flex; flex-wrap: wrap; gap: 2.4px 13.6px; }
    .linea b { font-weight: 600; }
    .gata { position: absolute; right: 24px; bottom: 14px; width: 174px; height: 116px;
      background: url(./gata-perfil.svg) no-repeat center / contain;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .22)); }
    .estudio { display: flex; align-items: flex-end; gap: 24px; padding: 20px; }
    .estudio img { display: block; }
  </style>
</helmet>
<div style="padding: 20px 20px 0">
  <div class="hero">
    <div class="datos">
      <div class="grados">17<sup>°</sup></div>
      <div class="condicion">Despejado</div>
      <div class="linea">
        <span>Máx <b>18°</b></span>
        <span>Mín <b>5°</b></span>
        <span>Lluvia <b>1%</b></span>
      </div>
    </div>
    <div class="gata" role="img" aria-label="Mamushka"></div>
  </div>
</div>
<div class="estudio">
  <img src="./gata-perfil.svg" height="200" alt="perfil">
  <img src="./gata-tres-cuartos.svg" height="200" alt="tres cuartos">
  <img src="./gata-frente.svg" height="200" alt="de frente">
  <img src="./gata-perfil.svg" height="104" alt="">
  <img src="./gata-tres-cuartos.svg" height="104" alt="">
  <img src="./gata-frente.svg" height="104" alt="">
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
