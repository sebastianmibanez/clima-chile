<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #f3f0ea;
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: #c96f4a; } a:hover { color: #a4512f; }
    .hero { position: relative; overflow: hidden; border-radius: 20px; padding: 24px;
      min-height: 210px; color: #fff; box-shadow: 0 2px 10px rgba(60, 50, 40, .09);
      background: linear-gradient(160deg, #3f7fc4, #79b0e0 70%, #a8cdec); }
    .datos { position: relative; z-index: 1; }
    .grados { font-size: 72px; line-height: .95; font-weight: 200; letter-spacing: -.045em; }
    .grados sup { font-size: .35em; font-weight: 400; vertical-align: super; margin-left: .05em; }
    .condicion { font-size: 18.4px; font-weight: 600; margin-top: 3.2px; }
    .linea { font-size: 13.6px; opacity: .85; margin-top: 8px;
      display: flex; flex-wrap: wrap; gap: 2.4px 13.6px; }
    .linea b { font-weight: 600; }
    .gata { position: absolute; bottom: 16px; width: 118px; height: 113px;
      background: url(./caminata.svg) no-repeat; background-size: 708px 113px;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .22));
      animation: pasos var(--ciclo) steps(6) infinite,
                 cruza var(--viaje) linear infinite,
                 rebote calc(var(--ciclo) / 6) ease-in-out infinite alternate; }
    @keyframes pasos { to { background-position: -708px 0; } }
    @keyframes cruza { from { left: -118px; } to { left: 100%; } }
    @keyframes rebote {
      from { transform: translateY(0) rotate(0deg); }
      to   { transform: translateY(-3px) rotate(-.9deg); }
    }
  </style>
</helmet>
<div style="padding: 20px">
  <div class="hero">
    <div class="datos">
      <div class="grados">17<sup>°</sup></div>
      <div class="condicion">Despejado</div>
      <div class="linea">
        <span>Máx <b>18°</b></span>
        <span>Mín <b>5°</b></span>
        <span>Lluvia <b>1%</b></span>
      </div>
    </div>
    <div class="gata" style="--ciclo: {{ciclo}}s; --viaje: {{viaje}}s"></div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"ciclo":{"editor":"range","default":0.96,"min":0.3,"max":3,"step":0.06,"unit":"s","section":"Ritmo"},"viaje":{"editor":"range","default":7,"min":3,"max":40,"step":0.5,"unit":"s","section":"Ritmo"}}'>
class Component extends DCLogic {
  renderVals() {
    return { ciclo: this.props.ciclo ?? 0.96, viaje: this.props.viaje ?? 7 };
  }
}
</script>
</body>
</html>
