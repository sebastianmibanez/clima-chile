    body { margin: 0; background: #f3f0ea;
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: #c96f4a; } a:hover { color: #a4512f; }
    .hero { position: relative; overflow: hidden; border-radius: 20px; padding: 24px;
      min-height: 210px; color: #fff; box-shadow: 0 2px 10px rgba(60, 50, 40, .09);

    .datos { position: relative; z-index: 1; }
    .grados { font-size: 72px; line-height: .95; font-weight: 200; letter-spacing: -.045em; }
    .grados sup { font-size: .35em; font-weight: 400; vertical-align: super; margin-left: .05em; }
    .condicion { font-size: 18.4px; font-weight: 600; margin-top: 3.2px; }
    .linea { font-size: 13.6px; opacity: .85; margin-top: 8px;
      display: flex; flex-wrap: wrap; gap: 2.4px 13.6px; }
    .linea b { font-weight: 600; }
    .gata { position: absolute; bottom: 10px; width: 140px; height: 113px;
      animation: cruza var(--viaje) linear infinite; }
    @keyframes cruza { from { left: -140px; } to { left: 100%; } }
    /* ---- la gata articulada: cada pieza es un grupo con su propio pivote ---- */
    svg * { transform-box: view-box; }
    @keyframes muslo { 0% { rotate: 16deg; } 50% { rotate: -16deg; } 100% { rotate: 16deg; } }
    @keyframes pierna { 0% { rotate: -12deg; } 30% { rotate: 3deg; } 60% { rotate: -20deg; } 100% { rotate: -12deg; } }
    @keyframes bote { 0%, 100% { translate: 0 0; } 50% { translate: 0 -2.5px; } }
    @keyframes cola { 0%, 100% { rotate: -6deg; } 50% { rotate: 8deg; } }
    @keyframes cabeza { 0%, 100% { rotate: -1.5deg; } 50% { rotate: 1.5deg; } }
    .muslo { animation: muslo var(--c) ease-in-out infinite; }
    .pantorrilla { animation: pierna var(--c) ease-in-out infinite; }
    .tronco { animation: bote calc(var(--c) / 2) ease-in-out infinite; }
    .cola { animation: cola calc(var(--c) * 1.5) ease-in-out infinite; }
    .craneo { animation: cabeza var(--c) ease-in-out infinite; }
  </style>
</helmet>
